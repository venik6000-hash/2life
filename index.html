<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="2life" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>2life — Дашборд</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow-x: hidden; max-width: 100vw; }
      body { overflow-y: auto; -webkit-text-size-adjust: 100%; }
      /* iOS/Android: убираем системный синий highlight при long-press на интерактивных областях мессенджера */
      [data-messenger-no-select] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
      .messenger-highlight {
        animation: messenger-highlight-flash 1200ms ease-out;
      }
      @keyframes messenger-highlight-flash {
        0%   { background: rgba(255, 220, 100, 0.45); }
        100% { background: transparent; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
