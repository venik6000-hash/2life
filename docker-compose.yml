services:

  # ─── PostgreSQL база данных ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: 2life
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 2life"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Node.js сервер ───────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/2life
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      MESSENGER_ENCRYPTION_SECRET: ${MESSENGER_ENCRYPTION_SECRET:?MESSENGER_ENCRYPTION_SECRET must be set in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      NODE_ENV: production
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads

  # ─── React фронтенд (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${PORT:-80}:80"

volumes:
  postgres_data:   # данные PostgreSQL — не теряются при перезапуске
  server_data:     # бэкапы сервера
  server_uploads:  # загруженные файлы чата (голосовые, картинки, документы) — должны переживать пересборку контейнера
